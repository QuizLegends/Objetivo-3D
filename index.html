<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Character Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Toolbar -->
    <header class="toolbar">
      <div class="toolbar-left">
        <h1 class="logo">3D Character Editor</h1>
      </div>
      <div class="toolbar-center">
        <label class="btn btn-primary" for="char-input">
          Importar Personagem
          <input type="file" id="char-input" accept=".fbx,.glb,.gltf" hidden />
        </label>
        <label class="btn btn-secondary" for="obj-input">
          Importar Objeto
          <input type="file" id="obj-input" accept=".fbx,.glb,.gltf" hidden />
        </label>
        <button class="btn btn-ghost" id="btn-play" disabled title="Reproduzir / Pausar">▶ Play</button>
        <button class="btn btn-ghost" id="btn-stop" disabled title="Parar animação">⏹ Stop</button>
      </div>
      <div class="toolbar-right">
        <span id="status" class="status">Pronto</span>
      </div>
    </header>

    <div class="main">
      <!-- Viewport -->
      <div id="viewport" class="viewport">
        <div id="loading" class="loading hidden">
          <div class="spinner"></div>
          <span>Carregando...</span>
        </div>
      </div>

      <!-- Side Panel -->
      <aside class="panel">
        <!-- Animations -->
        <section class="panel-section">
          <h2>Animações</h2>
          <select id="anim-select" class="select" disabled>
            <option value="">Nenhuma animação</option>
          </select>
        </section>

        <!-- Bones / Attach -->
        <section class="panel-section">
          <h2>Anexar Objeto</h2>
          <label class="label">Osso</label>
          <select id="bone-select" class="select" disabled>
            <option value="">Selecione um osso</option>
          </select>
          <button class="btn btn-primary btn-block" id="btn-attach" disabled>
            Anexar ao osso
          </button>
          <button class="btn btn-danger btn-block" id="btn-detach" disabled>
            Desanexar objeto
          </button>
        </section>

        <!-- Selection -->
        <section class="panel-section">
          <h2>Seleção</h2>
          <div class="radio-group">
            <label class="radio">
              <input type="radio" name="sel" value="character" id="sel-char" checked />
              Personagem
            </label>
            <label class="radio">
              <input type="radio" name="sel" value="object" id="sel-obj" />
              Objeto
            </label>
          </div>
        </section>

        <!-- Transform -->
        <section class="panel-section">
          <h2>Transformação</h2>

          <label class="label">Posição</label>
          <div class="xyz">
            <div class="xyz-item">
              <span>X</span>
              <input type="number" id="pos-x" step="0.01" value="0" class="input-num" />
            </div>
            <div class="xyz-item">
              <span>Y</span>
              <input type="number" id="pos-y" step="0.01" value="0" class="input-num" />
            </div>
            <div class="xyz-item">
              <span>Z</span>
              <input type="number" id="pos-z" step="0.01" value="0" class="input-num" />
            </div>
          </div>

          <label class="label">Rotação (graus)</label>
          <div class="xyz">
            <div class="xyz-item">
              <span>X</span>
              <input type="number" id="rot-x" step="1" value="0" class="input-num" />
            </div>
            <div class="xyz-item">
              <span>Y</span>
              <input type="number" id="rot-y" step="1" value="0" class="input-num" />
            </div>
            <div class="xyz-item">
              <span>Z</span>
              <input type="number" id="rot-z" step="1" value="0" class="input-num" />
            </div>
          </div>

          <label class="label">Tamanho (%)</label>
          <div class="size-row">
            <input type="number" id="size-pct" min="1" max="500" value="100" class="input-num" />
            <span class="unit">%</span>
          </div>
          <p class="hint">100 = normal · 50 = metade · 200 = dobro</p>
        </section>

        <!-- Brightness -->
        <section class="panel-section">
          <h2>Brilho</h2>
          <div class="btn-row">
            <button class="btn btn-ghost" id="btn-bright-down">− Brilho</button>
            <button class="btn btn-ghost" id="btn-bright-up">+ Brilho</button>
          </div>
          <p class="hint" id="bright-label">Exposição: 1.00</p>
        </section>
      </aside>
    </div>
  </div>

  <!-- Three.js + loaders via CDN (import map) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
